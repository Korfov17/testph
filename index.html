    <!-- Script de caché optimizado -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        // Inicialización silenciosa (sin mensaje inicial)
        progressBar.style.width = '0%';
        progressText.textContent = '';
        
        window.applicationCache.ondownloading = function() {
          progressText.textContent = 'Preparando caché...';
          progressBar.style.width = '0%';
        };

        window.applicationCache.onprogress = function(e) {
          const percent = Math.round(100 * (e.loaded / e.total));
          progressText.textContent = `Cargando: ${percent}%`;
          progressBar.style.width = percent + '%';
        };

        window.applicationCache.oncached = function() {
          progressText.textContent = '¡Caché lista! Actualiza la página.';
          progressBar.style.width = '100%';
          setTimeout(() => {
            progressText.textContent = 'Actualización completa';
            progressBar.style.width = '0%';
          }, 3000);
        };
      });
    </script>
