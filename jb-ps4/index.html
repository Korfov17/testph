<head>
    <title>Auto GoldHEN Host</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            background-color: #000000;
            height: 80%;
            background-position: center;
            text-align: center;
            background-repeat: no-repeat;
            background-size: cover;
            font-family: sans-serif;
        }

        .loader {
            position: absolute;
            left: 50%;
            top: 50%;
            margin: -75px 0 0 -75px;
            border: 10px solid #1f1e1e;
            border-radius: 50%;
            border-top: 10px solid #d40606;
            border-left: 10px solid #d40606;
            width: 120px;
            height: 120px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info {
            overflow: hidden;
            position: fixed;
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 45px;
            font-family: sans-serif;
            color: #d40606;
            transform: translate(-50%, -50%);
        }

        .j {
            font-size: 15px;
            color: #d40606;
        }

        /* Estilos para el panel de selección */
        .panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(31, 30, 30, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(212, 6, 6, 0.5);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }

        .panel h2 {
            color: #d40606;
            margin-top: 0;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .btn {
            background-color: #d40606;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background-color: #ff0a0a;
            transform: scale(1.02);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .version-info {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <!-- Panel de selección inicial -->
    <div id="selectionPanel" class="panel">
        <h2>Selecciona versión de GoldHEN</h2>
        <div class="btn-container">
            <button class="btn" onclick="startJailbreak('goldhen_2.3.bin')">
                GoldHEN 2.3
                <div class="version-info">Última versión estable</div>
            </button>
            <button class="btn" onclick="startJailbreak('goldhen_2.2.4.bin')">
                GoldHEN 2.2.4
                <div class="version-info">Versión anterior estable</div>
            </button>
            <button class="btn" onclick="startJailbreak('goldhen_2.1.bin')">
                GoldHEN 2.1
                <div class="version-info">Compatibilidad con firmware antiguo</div>
            </button>
            <button class="btn" onclick="startJailbreak('goldhen.bin')">
                GoldHEN Default
                <div class="version-info">Versión por defecto</div>
            </button>
        </div>
    </div>

    <!-- Contenido original (oculto inicialmente) -->
    <h1 id="progress" style='font-size:25px;text-align:center;text-shadow: 4px 4px 4px black;color:yellow;display:none;'></h1><br>
    <div id="loader" class="loader" style="display:none;"></div>
    <div id="allset" class="info" style="display:none;font-size:30px;text-align:center;text-shadow: 4px 4px 4px black;color:yellow;">
        Liberación completada. Cierra el Navegador!
    </div>

    <script>
        // Variable global para almacenar el archivo seleccionado
        let PLfile = "";
        
        // Función para iniciar el jailbreak con la versión seleccionada
        function startJailbreak(selectedFile) {
            PLfile = selectedFile;
            document.getElementById("selectionPanel").style.display = "none";
            document.getElementById("progress").style.display = "block";
            jbdone();
        }

        function load_pocB() {
            var req = new XMLHttpRequest();
            req.responseType = "arraybuffer";
            req.open('GET', PLfile);
            req.send();
            req.onreadystatechange = function () {
                if (req.readyState == 4) {
                    PLD = req.response;
                    var payload_buffer = chain.syscall(477, 0, PLD.byteLength*4, 7, 0x1002, -1, 0);
                    var pl = p.array_from_address(payload_buffer, PLD.byteLength*4);
                    var padding = new Uint8Array(4 - (req.response.byteLength % 4) % 4);
                    var tmp = new Uint8Array(req.response.byteLength + padding.byteLength);
                    tmp.set(new Uint8Array(req.response), 0);
                    tmp.set(padding, req.response.byteLength);
                    var shellcode = new Uint32Array(tmp.buffer);
                    pl.set(shellcode,0);
                    var pthread = p.malloc(0x10);
                    chain.call(libKernelBase.add32(OFFSET_lk_pthread_create), pthread, 0x0, payload_buffer, 0);
                    allset();
                }
            };
        }

        function jbdone() {
            window.progress.innerHTML = "Jailbreak hecho";
            goldhen();
        }

        function goldhen() {
            progress.innerHTML = "Cargando " + PLfile + "... por favor espere";
            document.getElementById("loader").style.display = "block";
            load_pocB();
        }

        function allset() {
            document.getElementById("loader").style.display = "none";
            document.getElementById("allset").style.display = "block";
        }
    </script>
    <script src="./int64.js"></script>
    <script src="./rop.js"></script>
    <script src="./kexploit.js"></script>
    <script type=module src="./alert.mjs"></script>
</body>
</html>
