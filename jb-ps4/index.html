<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jailbreak 9.00</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background-color: #FFFFFF;
      height: 80%;
      background-position: center;
      text-align: center;
      background-repeat: no-repeat;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      margin: -75px 0 0 -75px;
      border: 10px solid #1f1e1e;
      border-radius: 50%;
      border-top: 10px solid #d40606;
      border-left: 10px solid #d40606;
      width: 120px;
      height: 120px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .info {
      overflow: hidden;
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: 45px;
      font-family: sans-serif;
      color: #d40606;
      transform: translate(-50%, -50%);
    }

    #payload-menu button {
      padding: 10px 20px;
      font-size: 18px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 2px 2px 5px black;
    }
  </style>

  <script>
    (function checkUserAgentAndInit() {
      const ua = navigator.userAgent;
      const isPS4 = ua.includes("PlayStation 4");
      const fwMatch = ua.match(/PlayStation 4\/([\d.]+)/);
      const detectedFW = fwMatch ? fwMatch[1] : null;

      if (isPS4 && detectedFW === "9.00") {
        const scripts = [
          "./int64.js",
          "./rop.js",
          "./kexploit.js",
          "./alert.mjs"
        ];
        scripts.forEach(src => {
          const s = document.createElement("script");
          s.src = src;
          if (src.endsWith(".mjs")) s.type = "module";
          document.head.appendChild(s);
        });
      } else {
        let alertUserAgent = "";
        if (isPS4) {
          alertUserAgent = `Tu PlayStation 4 tiene el Firmware ${detectedFW || "Desconocido"}.\nSolo puedes Acceder si tiene el Firmware 9.00.`;
        } else {
          let os = "Dispositivo desconocido";
          if (/Windows/i.test(ua)) os = "Windows";
          else if (/Linux/i.test(ua)) os = "Linux";
          else if (/Android/i.test(ua)) os = "Android";
          else if (/iPhone/i.test(ua)) os = "iPhone";
          else if (/iPad/i.test(ua)) os = "iPad";
          else if (/Macintosh/i.test(ua)) os = "MacOS";
          alertUserAgent = `ERROR: No puedes Acceder aqui desde tu Dispositivo, esta parte solo es accesible desde una PS4.\nTu Dispositivo es: ${os}.`;
        }

        alert(alertUserAgent);
        document.head.innerHTML = '';
        document.body.innerHTML = '';
        document.body.style.backgroundColor = 'white';
        throw new Error("Dispositivo no compatible");
      }
    })();
  </script>
</head>

<body>
  <h1 id="progress" style="font-size:25px;text-align:center;text-shadow: 4px 4px 4px black;color:white;"></h1><br>

  <div id="loader" class="loader"></div>

  <div id="payload-menu" style="display:none; text-align:center; margin-top:20px;">
    <h2 style="color:white; text-shadow: 2px 2px 4px black;">Selecciona un HEN</h2>

    <button onclick="sendPayload('goldhen.bin', 'GoldHEN')" style="background-color:#d40606; color:white;">
      GoldHEN
    </button>

    <button onclick="sendPayload('goldhen2.bin', 'GoldHEN 2.2.5b')" style="background-color:#065fd4; color:white;">
      GoldHEN 2.2.5b
    </button>

    <button onclick="sendPayload('hen_custom.bin', 'Custom HEN')" style="background-color:#0a820a; color:white;">
      Custom HEN
    </button>
  </div>

  <div id="allset" class="info" style="display:none;font-size:30px;text-align:center;text-shadow: 4px 4px 4px black;color:white;">
   Jailbreak Completado. ¡Cierra el navegador!
  </div>

  <script>
    function loadPayload(payloadFile) {
      var req = new XMLHttpRequest();
      req.responseType = "arraybuffer";
      req.open('GET', payloadFile);
      req.send();

      req.onreadystatechange = function () {
        if (req.readyState === 4) {
          const PLD = req.response;
          const payload_buffer = chain.syscall(477, 0, PLD.byteLength * 4, 7, 0x1002, -1, 0);
          const pl = p.array_from_address(payload_buffer, PLD.byteLength * 4);
          const padding = new Uint8Array(4 - (PLD.byteLength % 4) % 4);
          const tmp = new Uint8Array(PLD.byteLength + padding.byteLength);
          tmp.set(new Uint8Array(PLD), 0);
          tmp.set(padding, PLD.byteLength);
          const shellcode = new Uint32Array(tmp.buffer);
          pl.set(shellcode, 0);

          const pthread = p.malloc(0x10);
          chain.call(libKernelBase.add32(OFFSET_lk_pthread_create), pthread, 0x0, payload_buffer, 0);

          allset(); // Actualiza el mensaje al finalizar
        }
      };
    }

    function jbdone() {
      showPayloadMenu();
    }

    function showPayloadMenu() {
      document.getElementById("loader").style.display = "none";
      document.getElementById("payload-menu").style.display = "block";
    }

    function sendPayload(payloadFile, displayName) {
      document.getElementById("payload-menu").style.display = "none";
      progress.innerHTML = `Cargando ${displayName}... por favor espere`;
      loadPayload(payloadFile);
    }

    function allset() {
      document.getElementById("loader").style.display = "none";
      progress.innerHTML = "¡Carga completa!";
      document.getElementById("allset").style.display = "block";
    }
  </script>
</body>
</html>
